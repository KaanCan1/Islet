    <script>

        tl.to("#el-01-hover", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);

        tl.to({}, { duration: 33.4 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
